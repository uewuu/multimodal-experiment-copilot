name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  release-checks:
    name: ${{ matrix.lane }} / Python 3.11
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lane: windows-full
          - os: ubuntu-24.04
            lane: portable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release-py311.txt

      - name: Install dependencies
        run: python -m pip install -c constraints-release-py311.txt -r requirements.txt

      - name: Validate dependency resolution
        run: python -m pip check

      - name: Probe actual Windows workspace and temporary filesystem
        if: matrix.lane == 'windows-full'
        shell: python
        run: |
          import ctypes, json, pathlib, sys, tempfile
          from ctypes import wintypes
          assert sys.platform == 'win32' and sys.version_info[:2] == (3, 11)
          dll = ctypes.WinDLL('kernel32', use_last_error=True)
          dll.GetVolumePathNameW.argtypes = [wintypes.LPCWSTR, wintypes.LPWSTR, wintypes.DWORD]
          dll.GetVolumePathNameW.restype = wintypes.BOOL
          dll.GetVolumeInformationW.argtypes = [wintypes.LPCWSTR, wintypes.LPWSTR, wintypes.DWORD,
              ctypes.POINTER(wintypes.DWORD), ctypes.POINTER(wintypes.DWORD), ctypes.POINTER(wintypes.DWORD),
              wintypes.LPWSTR, wintypes.DWORD]
          dll.GetVolumeInformationW.restype = wintypes.BOOL
          dll.GetDriveTypeW.argtypes = [wintypes.LPCWSTR]
          dll.GetDriveTypeW.restype = wintypes.UINT
          for role, path in [('workspace', pathlib.Path.cwd()), ('temporary', pathlib.Path(tempfile.gettempdir()))]:
              volume, filesystem = ctypes.create_unicode_buffer(1024), ctypes.create_unicode_buffer(64)
              assert dll.GetVolumePathNameW(str(path), volume, len(volume)), ctypes.get_last_error()
              assert dll.GetVolumeInformationW(volume.value, None, 0, None, None, None, filesystem, len(filesystem))
              drive_type = dll.GetDriveTypeW(volume.value)
              print(json.dumps(dict(role=role, filesystem=filesystem.value, drive_type=drive_type)))
              assert filesystem.value == 'NTFS' and drive_type == 3, 'local fixed NTFS required'

      - name: Windows full repository acceptance
        if: matrix.lane == 'windows-full'
        run: python -B scripts/run_release_checks.py --lane windows-full > windows-full.json

      - name: Confirm real native tests executed
        if: matrix.lane == 'windows-full'
        shell: python
        run: |
          import json, pathlib
          report = json.loads(pathlib.Path('windows-full.json').read_text(encoding='utf-8-sig'))
          assert report['status'] == 'passed' and report['coverage_complete']
          native = [row for row in report['files'] if row['file'] == 'tests/test_artifact_observation_windows.py']
          assert len(native) == 1 and native[0]['exit_code'] == 0 and native[0]['outcomes']
          assert all(item['outcome'] == 'passed' for item in native[0]['outcomes'])

      - name: Linux portable acceptance only (no native or full-platform claim)
        if: matrix.lane == 'portable'
        run: python -B scripts/run_release_checks.py --lane portable --test-list scripts/release-portable-files.json > linux-portable.json

      - name: Linux real unsupported-platform observation
        if: matrix.lane == 'portable'
        shell: python
        run: |
          import json, subprocess, sys
          assert sys.platform == 'linux' and sys.version_info[:2] == (3, 11)
          result = subprocess.run([sys.executable, '-B', 'examples/v1_bound_workflows_demo.py', '--scenario', 'G'],
                                  capture_output=True, text=True, check=False, timeout=60)
          report = json.loads(result.stdout)
          assert result.returncode == 3 and report['status'] == 'unsupported'
          assert report['facts']['status'] == 'unsupported_platform' and not report['facts'].get('sha256')

      - name: Machine evidence in job log
        if: always()
        shell: python
        run: |
          import pathlib
          for name in ('windows-full.json', 'linux-portable.json'):
              path = pathlib.Path(name)
              if path.is_file():
                  print(path.read_text(encoding='utf-8-sig'))
